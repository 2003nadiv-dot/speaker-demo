<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D Product Viewer</title>
<style>
  :root{ --panel:rgba(13,19,28,.82); --line:rgba(160,185,215,.18); --txt:#e8eef6; --mut:#8fa1b6; --acc:#ffb020; --accInk:#1b1200; --dockH:150px; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);background:#0a1018;
    font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
  canvas#c.over{cursor:pointer} canvas#c.grabbing{cursor:grabbing}
  .hide{display:none!important}

  .top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;pointer-events:none;z-index:5}
  .top>*{pointer-events:auto}
  h1{margin:0;font-size:15px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  h1 small{display:block;margin-top:2px;font-size:11px;letter-spacing:.02em;font-weight:400;text-transform:none;color:#b9c7d6}
  body.lightui h1{color:#16202b;text-shadow:none} body.lightui h1 small{color:#4b5a6a}
  .tb{display:flex;gap:8px}

  .btn,.chip{font:inherit;color:var(--txt);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
  .btn:hover,.chip:hover{background:rgba(255,255,255,.13)}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:700}
  .chip{padding:5px 10px;font-size:12px;border-radius:999px}
  .chip[aria-pressed="true"],.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:var(--acc)}
  .btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .top .btn{background:rgba(13,19,28,.6)}
  .sep{width:1px;height:20px;background:var(--line);flex:none}

  .panel{position:fixed;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;z-index:4}
  #parts{left:12px;top:64px;bottom:calc(var(--dockH) + 22px);width:240px;overflow:auto;padding:8px 6px}
  #info{right:12px;top:64px;bottom:calc(var(--dockH) + 22px);width:290px;overflow:auto;padding:14px}
  .cat{margin:10px 8px 4px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .row-p{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;cursor:pointer}
  .row-p:hover{background:rgba(255,255,255,.07)}
  .row-p.sel{background:color-mix(in srgb,var(--acc) 16%,transparent);outline:1px solid var(--acc)}
  .row-p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .eye{width:22px;height:22px;flex:none;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
  .eye i{width:9px;height:9px;border-radius:50%;background:var(--acc);display:block}
  .eye.off i{background:transparent;border:1.5px solid var(--mut)}
  .plist-head{display:flex;justify-content:space-between;align-items:center;padding:2px 8px 4px;color:var(--mut);font-size:11px}
  .plist-head button{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:0}

  #info h2{margin:2px 0 6px;font-size:17px}
  #info h3{margin:16px 0 6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
  #info p{margin:0 0 8px;color:#c9d5e3}
  .tag{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accInk);background:var(--acc);border-radius:5px;padding:1px 7px;font-weight:700}
  table.kv{width:100%;border-collapse:collapse}
  table.kv td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
  table.kv td:first-child{color:var(--mut);width:42%;padding-right:8px}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .src{margin-top:10px;font-size:11px;color:var(--mut)} .src a{color:#9cc4ff}
  .empty{color:var(--mut)}

  .dock{left:50%;transform:translateX(-50%);bottom:12px;width:min(1000px,calc(100% - 24px));padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lbl{color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  input[type=range]{flex:1;min-width:110px;height:28px;accent-color:var(--acc);cursor:pointer}
  .pct{width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--acc);font-weight:700}
  .sw{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;white-space:nowrap;flex:none}
  input[type=color]{width:36px;height:28px;border:1px solid var(--line);border-radius:7px;background:none;padding:1px;cursor:pointer;flex:none}

  #tip{position:fixed;pointer-events:none;z-index:6;background:rgba(8,12,18,.92);border:1px solid var(--line);padding:3px 9px;border-radius:7px;font-size:12px;opacity:0;transform:translate(12px,14px);transition:opacity .1s}
  #hint{position:fixed;left:50%;bottom:calc(var(--dockH) + 22px);transform:translateX(-50%);z-index:3;background:rgba(8,12,18,.72);border:1px solid var(--line);
    padding:6px 14px;border-radius:999px;color:#c9d5e3;font-size:12px;pointer-events:none;transition:opacity .6s;text-align:center;max-width:calc(100% - 24px)}
  #hint.gone{opacity:0}
  #loading{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:3;color:#c9d5e3;font-size:14px;pointer-events:none;text-align:center}
  #loading .bar{width:180px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin:10px auto 0;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
  #status{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:9;width:min(440px,calc(100% - 32px));background:rgba(13,19,28,.96);
    border:1px solid var(--acc);border-radius:14px;padding:18px;text-align:center}
  #status b{font-size:16px} #status p{color:#c9d5e3;margin:8px 0 14px} #status .btn{margin:0 4px}

  #labels{position:fixed;inset:0;pointer-events:none;z-index:2}
  #labels svg{position:absolute;inset:0;width:100%;height:100%}
  #labels div{position:absolute;left:0;top:0;font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(8,12,18,.82);border:1px solid var(--acc);color:#fff;white-space:nowrap;will-change:transform}

  @media (max-width:820px){
    #parts,#info{left:8px;right:8px;width:auto;top:58px;bottom:auto;max-height:calc(100% - var(--dockH) - 90px)}
    .dock{bottom:8px;padding:8px 10px;gap:7px}
    h1{font-size:13px}
    .dock .lbl{display:none}
    .dock .row{flex-wrap:nowrap;gap:8px}
    .dock .row.scroll{overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .dock .row.scroll::-webkit-scrollbar{display:none}
    .dock .grp{flex-wrap:nowrap;flex:none}
    .dock .btn{padding:7px 10px}
    input[type=range]{min-width:90px}
  }
</style>
</head>
<body data-config="product.json">
<canvas id="c" tabindex="0" aria-label="Interactive 3D product viewer"></canvas>
<div id="labels"><svg id="leaders"></svg></div>

<div class="top">
  <h1 id="title">3D Product<small id="subtitle">Interactive exploded view</small></h1>
  <div class="tb">
    <button class="btn" id="tglParts" aria-pressed="true">Parts</button>
    <button class="btn" id="tglInfo" aria-pressed="true">Info</button>
    <button class="btn" id="tglLite" aria-pressed="false" title="Lower quality for slower devices">Lite</button>
  </div>
</div>

<aside id="parts" class="panel" aria-label="Parts list"></aside>
<aside id="info" class="panel" aria-label="Part details and specs"><div id="sel"></div><div id="specs"></div></aside>

<div id="loading">Loading 3D model…<div class="bar"><i id="loadBar"></i></div></div>
<div id="status" class="hide" role="alert"></div>
<div id="tip"></div>
<div id="hint" class="gone"></div>

<div class="dock panel" id="dock">
  <div class="row scroll" id="exRow">
    <label class="lbl" for="ex">Explode</label>
    <input id="ex" type="range" min="0" max="100" value="0" step="1">
    <span class="pct" id="pct">0%</span>
    <button class="btn pri" id="bExplode">Explode</button>
    <button class="btn" id="bAssemble">Assemble</button>
  </div>
  <div class="row scroll" id="chipRow"></div>
  <div class="row scroll hide" id="sliceRow">
    <span class="lbl">Cutaway</span>
    <div class="grp"><button class="chip" data-axis="x" aria-pressed="true">Side to side</button><button class="chip" data-axis="z" aria-pressed="false">Front to back</button></div>
    <input id="slicePos" type="range" min="0" max="100" value="50" aria-label="Cut position">
  </div>
  <div class="row scroll hide" id="paintRow"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="viewer.js"></script>
</body>
</html>
